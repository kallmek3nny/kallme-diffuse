name: Fix smart rendering compile scope

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-smart-rendering.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move artwork profile out of inner class
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt")
          text = path.read_text(encoding="utf-8")
          declaration = "        private data class ArtworkMotionProfile(val speed: Float, val biasX: Float, val biasY: Float)\n"
          anchor = "    inner class DiffuseEngine : Engine(),\n"
          outer_declaration = "    private data class ArtworkMotionProfile(val speed: Float, val biasX: Float, val biasY: Float)\n\n"
          if text.count(declaration) != 1:
              raise SystemExit(f"expected one inner profile declaration, found {text.count(declaration)}")
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one engine anchor, found {text.count(anchor)}")
          text = text.replace(declaration, "", 1)
          text = text.replace(anchor, outer_declaration + anchor, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit compile fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt
          git commit -m "fix: move artwork motion profile to outer scope"
          git push origin HEAD:main
