name: Apply renderer quality pass

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-renderer-quality.yml

permissions:
  contents: write

jobs:
  quality-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply renderer quality pass
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''            uniform float border;\n            uniform float2 artMotion;''',
              '''            uniform float border;\n            uniform float2 artMotion;\n            uniform float bass;\n            uniform float mids;\n            uniform float highs;''',
              "audio uniforms",
          )

          replace_once(
              '''                float2 r = float2(fbm(0.5 * uv + 2.0 * q + float2(timeScaled * 0.05, 0.0)),\n                                  fbm(0.5 * uv + 2.0 * q + float2(timeScaled * 0.1, 0.0)));\n                r = (r - float2(0.5, 0.5)) * (scale + border) + float2(0.5, 0.5);\n                float2 tc = clamp(r, 0.0, 1.0) * fieldRes;\n                half4 col = field.eval(tc);''',
              '''                float2 r = float2(fbm(0.5 * uv + 2.0 * q + float2(timeScaled * 0.05, 0.0)),\n                                  fbm(0.5 * uv + 2.0 * q + float2(timeScaled * 0.1, 0.0)));\n                r = (r - float2(0.5, 0.5)) * (scale + border) + float2(0.5, 0.5);\n\n                // A tiny radial elastic deformation makes bass hits feel physical instead of\n                // simply zooming the whole frame. The amplitude stays deliberately subtle.\n                float2 centered = r - float2(0.5, 0.5);\n                float radial = length(centered);\n                float elasticWave = 0.5 + 0.5 * sin(radial * 13.0 - timeScaled * 2.1);\n                centered *= 1.0 + bass * (0.018 + 0.022 * elasticWave);\n                r = centered + float2(0.5, 0.5);\n\n                // Sample a nearby version of the same colour field and fold it back into the\n                // primary sample. This creates depth without another expensive noise octave.\n                float2 depthR = clamp(r + (q - float2(0.5, 0.5)) * (0.045 + mids * 0.035), 0.0, 1.0);\n                float2 tc = clamp(r, 0.0, 1.0) * fieldRes;\n                float2 depthTc = depthR * fieldRes;\n                float depthMix = 0.10 + mids * 0.09;\n                half4 col = field.eval(tc);\n                half4 depthCol = field.eval(depthTc);\n                col = mix(col, depthCol, half(depthMix));''',
              "layered field depth",
          )

          replace_once(
              '''                    half4 prev = fieldOld.eval(tc);\n                    float fdiff = length(float3(prev.rgb) - float3(col.rgb));''',
              '''                    half4 prev = fieldOld.eval(tc);\n                    half4 prevDepth = fieldOld.eval(depthTc);\n                    prev = mix(prev, prevDepth, half(depthMix));\n                    float fdiff = length(float3(prev.rgb) - float3(col.rgb));''',
              "crossfade depth sampling",
          )

          replace_once(
              '''                // Uniform sub-LSB screen-space dither hides the final framebuffer's quantization.\n                // The blur itself stays in float precision so there are no baked-in contour steps.\n                float n = fract(52.9829189 * fract(dot(fragCoord, float2(0.06711056, 0.00583715))));\n                float d = (n - 0.5) / 255.0;\n                return half4(clamp(float3(col.rgb) + float3(d), 0.0, 1.0), 1.0);''',
              '''                // Gentle colour shaping after the warp: a small saturation lift, soft contrast,\n                // and restrained highlight bloom. This keeps album identity while avoiding muddy washes.\n                float3 rgb = float3(col.rgb);\n                float luminance = dot(rgb, float3(0.2126, 0.7152, 0.0722));\n                float saturation = 1.06 + highs * 0.08;\n                rgb = mix(float3(luminance), rgb, saturation);\n                rgb = (rgb - float3(0.5)) * (1.03 + mids * 0.025) + float3(0.5);\n                rgb = clamp(rgb, 0.0, 1.0);\n                float bloom = smoothstep(0.62, 0.94, luminance) * (0.025 + highs * 0.025);\n                rgb = 1.0 - (1.0 - rgb) * (1.0 - bloom);\n\n                // Uniform sub-LSB screen-space dither hides the final framebuffer's quantization.\n                // The blur itself stays in float precision so there are no baked-in contour steps.\n                float n = fract(52.9829189 * fract(dot(fragCoord, float2(0.06711056, 0.00583715))));\n                float d = (n - 0.5) / 255.0;\n                return half4(clamp(rgb + float3(d), 0.0, 1.0), 1.0);''',
              "tone shaping",
          )

          replace_once(
              '''            shader.setFloatUniform("border", ogBorderEased * 0.35f)\n            ogFieldPaint.shader = shader''',
              '''            shader.setFloatUniform("border", ogBorderEased * 0.35f)\n            shader.setFloatUniform("bass", if (isBeatZonesEnabled) bassEnergy.coerceIn(0f, 1f) else 0f)\n            shader.setFloatUniform("mids", if (isBeatZonesEnabled) midEnergy.coerceIn(0f, 1f) else 0f)\n            shader.setFloatUniform("highs", if (isBeatZonesEnabled) trebleEnergy.coerceIn(0f, 1f) else 0f)\n            ogFieldPaint.shader = shader''',
              "audio uniform binding",
          )

          path.write_text(text, encoding="utf-8")

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit renderer quality pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt
          git commit -m "feat: improve diffuse renderer depth and color"
          git push origin HEAD:main

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kallme-diffuse-renderer-quality-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
