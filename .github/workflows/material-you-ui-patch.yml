name: Apply Material You UI redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/material-you-ui-patch.yml'
      - '.github/scripts/material_you_ui_patch.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply UI patch
        run: python .github/scripts/material_you_ui_patch.py

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit Material You redesign
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/gushypushy/diffusereborn/MainActivity.kt \
                  app/src/main/res/layout/activity_main.xml \
                  app/src/main/res/layout/item_switch.xml \
                  app/src/main/res/layout/item_slider.xml \
                  app/src/main/res/values/themes.xml \
                  app/src/main/res/values/styles_settings.xml \
                  app/src/main/res/drawable/glass_panel.xml \
                  app/src/main/res/drawable/renderer_pill.xml \
                  app/src/main/res/drawable/live_dot.xml \
                  app/src/main/res/drawable/bottom_action_scrim.xml
          git commit -m 'ui: redesign settings with Material You'
          git push origin HEAD:main
