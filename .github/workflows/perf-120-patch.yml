name: Apply 120Hz performance pass

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/perf-120-patch.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply patch
        run: python .github/scripts/perf_120_patch.py

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit optimized source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt
          git add app/src/main/java/com/gushypushy/diffusereborn/MusicListenerService.kt
          git add app/src/main/java/DiffusePreviewView.kt
          git diff --cached --quiet && exit 1
          git commit -m 'perf: optimize renderer for 120hz'
          git push origin HEAD:main
