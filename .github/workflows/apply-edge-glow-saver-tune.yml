name: Apply edge glow saver tune

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-edge-glow-saver-tune.yml

permissions:
  contents: write

jobs:
  tune-edge-glow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Tune low-power edge glow
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''        private var edgeGlowPaletteHash = Int.MIN_VALUE\n        private var edgeGlowDepth = 0f''',
              '''        private var edgeGlowPaletteHash = Int.MIN_VALUE\n        private var edgeGlowLowPower = false\n        private var edgeGlowDepth = 0f''',
              "edge glow cache state",
          )

          replace_once(
              '''        private fun ensureEdgeGlowShaders(w: Float, h: Float) {\n            val paletteHash = targetColors.hashCode()\n            val width = w.toInt()\n            val height = h.toInt()\n            if (edgeGlowWidth == width && edgeGlowHeight == height && edgeGlowPaletteHash == paletteHash) return\n            edgeGlowWidth = width\n            edgeGlowHeight = height\n            edgeGlowPaletteHash = paletteHash\n            edgeGlowDepth = min(w, h) * 0.13f''',
              '''        private fun isLowPowerGlowMode(): Boolean {\n            return isPowerSaver || systemPowerSaveMode ||\n                    (isBatteryIntelligenceEnabled && !batteryCharging && batteryPercent <= 20)\n        }\n\n        private fun ensureEdgeGlowShaders(w: Float, h: Float) {\n            val paletteHash = targetColors.hashCode()\n            val width = w.toInt()\n            val height = h.toInt()\n            val lowPower = isLowPowerGlowMode()\n            if (edgeGlowWidth == width && edgeGlowHeight == height &&\n                edgeGlowPaletteHash == paletteHash && edgeGlowLowPower == lowPower) return\n            edgeGlowWidth = width\n            edgeGlowHeight = height\n            edgeGlowPaletteHash = paletteHash\n            edgeGlowLowPower = lowPower\n            edgeGlowDepth = min(w, h) * if (lowPower) 0.085f else 0.13f''',
              "low power glow shaders",
          )

          replace_once(
              '''            val high = if (isBeatZonesEnabled) trebleEnergy else 0f\n            val pulse = (bassEnergy * userBeatPulse * 0.35f + high * 0.75f).coerceIn(0f, 1f)\n            val alpha = (34f + pulse * 86f).toInt().coerceIn(24, 120)''',
              '''            val high = if (isBeatZonesEnabled) trebleEnergy else 0f\n            val pulse = (bassEnergy * userBeatPulse * 0.35f + high * 0.75f).coerceIn(0f, 1f)\n            val alpha = if (isLowPowerGlowMode()) {\n                (16f + pulse * 38f).toInt().coerceIn(10, 54)\n            } else {\n                (34f + pulse * 86f).toInt().coerceIn(24, 120)\n            }''',
              "low power glow alpha",
          )

          path.write_text(text, encoding="utf-8")

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit edge glow tune
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt
          git commit -m "fix: soften edge glow in low power modes"
          git push origin HEAD:main

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kallme-diffuse-edge-glow-tuned-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
