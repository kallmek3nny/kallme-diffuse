name: Emulator launch smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emulator-launch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.gushypushy.diffusereborn
            echo '=== LAUNCHING MAIN ACTIVITY ==='
            adb shell am start -W -n com.gushypushy.diffusereborn/.MainActivity || true
            sleep 6
            echo '=== PROCESS STATE ==='
            adb shell pidof com.gushypushy.diffusereborn || true
            echo '=== CRASH / ANDROIDRUNTIME LOGS ==='
            adb logcat -d -v threadtime AndroidRuntime:E ActivityTaskManager:E ActivityManager:E '*:S' | tail -n 300 || true
            echo '=== APP-SCOPED LOG LINES ==='
            adb logcat -d -v threadtime | grep -i -E 'diffusereborn|FATAL EXCEPTION|AndroidRuntime|InflateException|ClassCastException|IllegalStateException|Resources.NotFoundException|Theme' | tail -n 400 || true
            echo '=== VERIFY PROCESS ALIVE ==='
            adb shell pidof com.gushypushy.diffusereborn
