name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply battery optimization source patch
        if: github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt")
          text = path.read_text(encoding="utf-8")

          old1 = "\n".join([
              "            if (surgeProgress > 0.01f) {",
              "                surgeProgress *= 0.94f",
              "            } else {",
              "                surgeProgress = 0f",
              "            }",
          ])
          new1 = "\n".join([
              "            // Battery optimization: preserve the visual decay while reducing callback wakeups.",
              "            if (surgeProgress > 0.01f) {",
              "                val dtSec = dtMs / 1000f",
              "                val refreshHz = TARGET_FPS.coerceIn(30f, 240f)",
              "                surgeProgress *= 0.94f.pow(dtSec * refreshHz)",
              "                if (surgeProgress <= 0.01f) surgeProgress = 0f",
              "            } else {",
              "                surgeProgress = 0f",
              "            }",
          ])

          old2 = "\n".join([
              "            if (isVisible) {",
              "                choreographer.postFrameCallback(this)",
              "            }",
          ])
          new2 = "\n".join([
              "            // Battery optimization: sleep until the next target frame instead of waking on every display vsync.",
              "            if (isVisible) {",
              "                val remainingNs = if (lastDrawTimeNs == 0L) 0L else frameIntervalNs - (System.nanoTime() - lastDrawTimeNs)",
              "                if (remainingNs >= 1_000_000L) {",
              "                    choreographer.postFrameCallbackDelayed(this, (remainingNs / 1_000_000L).coerceAtLeast(1L))",
              "                } else {",
              "                    choreographer.postFrameCallback(this)",
              "                }",
              "            }",
          ])

          if new1 in text and new2 in text:
              print("Battery optimization already applied")
          else:
              if text.count(old1) != 1:
                  raise SystemExit(f"expected exactly one surge block, found {text.count(old1)}")
              if text.count(old2) != 1:
                  raise SystemExit(f"expected exactly one callback block, found {text.count(old2)}")
              path.write_text(text.replace(old1, new1, 1).replace(old2, new2, 1), encoding="utf-8")

      - name: Commit battery optimization source patch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt; then
            echo "No source patch to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/gushypushy/diffusereborn/DiffuseWallpaperService.kt
            git commit -m "perf: reduce wallpaper frame callback wakeups"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kallme-diffuse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
